# pi assumed 3.14159
aoi:
  top:
    entity_name: top_aoi_plane
    description: "Top AOI plane for roof-mounted sensors "

    # Plane geometry (local to plane)
    size:
      width: 0.8
      depth: 0.8

    # World pose (copied from Gazebo UI)
    pose:
      x: 0.1
      y: 0.0
      z: 1.29
      roll: 0.0
      pitch: 0.0
      yaw: 0.0

    visual:
      color: [0.10, 0.25, 0.85, 0.60]

    grid:
      rows: 4
      cols: 4


  front:
    entity_name: front_aoi_plane
    description: "Front AOI plane for forward-facing sensors "

    # Rectangle facing forward
    size:
      width: 0.3
      depth: 1

    # World pose (copied from Gazebo UI)
    pose:
      x: 1.25
      y: 0.0
      z: 0.62
      roll: 0.0
      pitch: 1.57
      yaw: 0.0

    visual:
      color: [0.95, 0.80, 0.10, 0.60]

    grid:
      rows: 3
      cols: 2

  # left:
