  #   grid:
  #     rows: 2
  #     cols: 2


  right:
    entity_name: right_aoi_plane
    description: "Right side AOI plane for lateral sensors"

    # Vertical plane on the right side of the train
    size:
      width: 0.5
      depth: 1

    # World pose (relative to train)
    pose:
      x: 0.0
      y: -0.5       # right side (negative Y)
      z: 0.7        # mid-height of train body
      roll: 0.0
      pitch: 1.57   # vertical plane
      yaw: -1.57    # facing right

    visual:
      color: [1.0, 1.0, 1.0, 0.4]

    grid:
      rows: 2
      cols: 5